<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review</title>
    <meta name="description" content="Complete this form to submit your product reviews, ratings, and valuable feedback.">
    <meta name="author" content="Andres Sejas">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <main>
        <form action="review.html" method="get">
            <label class="req" for="productName">Product Name</label>
            <select name="productName" id="productName" required>
                <option value="" disabled selected>Select a Product</option>
            </select>

            <label class="req">Overall Rating</label>
            <div class="stars">
                <input type="radio" id="fivestar" name="stars" value="5" required><label for="fivestar"></label>
                <input type="radio" id="fourstar" name="stars" value="4" required><label for="fourstar"></label>
                <input type="radio" id="threestar" name="stars" value="3" required><label for="threestar"></label>
                <input type="radio" id="twostar" name="stars" value="2" required><label for="twostar"></label>
                <input type="radio" id="onestar" name="stars" value="1" required><label for="onestar"></label>
            </div>

            <label class="req" for="installationDate">Date of Installation</label>
            <input type="date" id="installationDate" name="installationDate" required>

            <label>Which features did you find useful in the product?<br>(Check all that apply)</label>
            <label><input type="checkbox" id="durability" name="usefulFeatures" value="durability"> Durability</label>
            <label><input type="checkbox" id="easyUse" name="usefulFeatures" value="easyUse"> Easy of Use</label>
            <label><input type="checkbox" id="performance" name="usefulFeatures" value="performance">
                Performance</label>
            <label><input type="checkbox" id="design" name="usefulFeatures" value="design"> Design</label>

            <label for="review">Written Review (Optional)</label>
            <textarea id="review" name="review" rows="4"></textarea>

            <label for="userName">Your Name (Optional)</label>
            <input type="text" id="userName" name="userName">

            <button type="submit" value="Post Review">Post Review</button>
        </form>
    </main>
    <footer>
        <p>&copy; <span id="currentyear"></span> ⛄ Andres Sejas ⛄ Bolivia</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
